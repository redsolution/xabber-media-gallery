# Replace hostname, certificate paths, and checkout path before use.
server {
    listen 80;
    server_name gallery.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gallery.example.com;
    ssl_certificate /etc/letsencrypt/live/gallery.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gallery.example.com/privkey.pem;

    # Default application file limit: 30 MiB; leave room for multipart overhead.
    client_max_body_size 32m;

    location /media/ {
        alias /srv/xabber-media-gallery/uploaded/symlinks/;
        autoindex off;
        # Public user content: download by default and prevent MIME sniffing.
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/ {
        alias /srv/xabber-media-gallery/staticfiles/;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
